<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Logos</title>
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      background-color: #f7f7f7;
      border: 2px solid #ddd;
    }

    #controls {
      text-align: center;
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="fallButton">Make Logos Fall</button>
  </div>
  <canvas id="physicsCanvas"></canvas>

  <script>
		<script src="assets/js/main.js"></script>
  </script>
</body>
</html>
